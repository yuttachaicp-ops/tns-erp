services:
  # ── Backend + Web Dashboard ──────────────────────────────
  - type: web
    name: tns-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: |
      npm ci &&
      npx prisma generate &&
      npm run build
    startCommand: |
      npx prisma migrate deploy &&
      node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tns-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    healthCheckPath: /api/auth/me
    autoDeploy: true
    plan: starter

databases:
  # ── PostgreSQL ───────────────────────────────────────────
  - name: tns-erp-db
    databaseName: tns_erp
    user: tns_user
    plan: starter
    postgresMajorVersion: 15
